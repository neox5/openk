syntax = "proto3";

package openk.users.v1;

option go_package = "github.com/neox5/openk/internal/api_gen/openk/users/v1;usersv1";

import "openk/common/v1/crypto_v1.proto";
import "google/protobuf/timestamp.proto";

// UserProfile represents the public user information
message UserProfile {
  string id = 1;
  string username = 2;
  bytes public_key = 3;
  google.protobuf.Timestamp created_at = 4;
}
